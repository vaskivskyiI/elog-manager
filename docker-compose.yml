# ELOG Manager next to an elogd that runs on the host.
#
#   cp .env.example .env        # ELOG_DIR, ELOG_UID, ELOG_GID
#   sudo docker compose up -d --build
#
# The ELOG directory is mounted at the same path inside the container, so the
# paths in elogd.cfg (e.g. "Password file") resolve the same way.
services:
  elog-manager:
    build: .
    image: elog-manager:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # backups, change log and session key live in the "state" volume
      ELOGMGR_STATE_DIR: /state
    # Same uid/gid as elogd ("Usr"/"Grp" in elogd.cfg): needed to write elogd.cfg
    # and to send elogd the reload signal (SIGHUP).
    user: "${ELOG_UID:-1000}:${ELOG_GID:-1000}"
    # Share the host's process list so the manager can find and signal elogd.
    # If elogd runs in this compose project instead, use  pid: "service:elogd"
    pid: host
    ports:
      - "127.0.0.1:${ELOGMGR_PORT:-8090}:8090"
    volumes:
      - ${ELOG_DIR:-/usr/local/elog}:${ELOG_DIR:-/usr/local/elog}
      - state:/state
      # Mount more directories if passwords.pwd lives outside ELOG_DIR, e.g.
      # - /mnt/elog_data:/mnt/elog_data

volumes:
  state:
