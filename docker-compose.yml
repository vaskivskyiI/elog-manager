# ELOG Manager next to an elogd that runs on the host or in Docker.
#
#   cp .env.example .env        # ELOG_DIR, ELOG_UID, ELOG_GID (+ *_HOST if elogd runs in Docker)
#   sudo docker compose up -d --build
#
# The manager reads the paths in elogd.cfg ("Password file", "Logbook dir"), so it
# must see the configuration and data folders at exactly those paths:
#   ELOG_DIR, ELOG_DATA_DIR    paths used in elogd.cfg (inside the containers)
#   ELOG_DIR_HOST, ELOG_DATA_HOST   where these folders are on the host; default: the
#                              same paths (native elogd)
services:
  elog-manager:
    build: .
    image: elog-manager:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # backups, change log and session key live in the "state" volume
      ELOGMGR_STATE_DIR: /state
    # Same uid/gid as elogd ("Usr"/"Grp" in elogd.cfg): needed to write elogd.cfg
    # and to send elogd the reload signal (SIGHUP).
    user: "${ELOG_UID:-1000}:${ELOG_GID:-1000}"
    # Share the host's process list so the manager can find and signal elogd.
    # If elogd runs in this compose project instead, use  pid: "service:elogd"
    pid: host
    # Docker's default AppArmor profile only lets a container signal processes in
    # other containers, so SIGHUP to the host's elogd is refused even for the same
    # user. The container still runs as ELOG_UID without extra capabilities.
    # On SELinux hosts (Fedora/RHEL) use "label=disable" instead.
    security_opt:
      - apparmor=unconfined
    ports:
      - "127.0.0.1:${ELOGMGR_PORT:-8090}:8090"
    volumes:
      - ${ELOG_DIR_HOST:-${ELOG_DIR:-/usr/local/elog}}:${ELOG_DIR:-/usr/local/elog}
      - ${ELOG_DATA_HOST:-${ELOG_DATA_DIR:-/mnt/elog_data}}:${ELOG_DATA_DIR:-/mnt/elog_data}
      - state:/state

volumes:
  state:
