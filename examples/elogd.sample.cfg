[global]
# Fictional sample configuration used by the tests and the demo.
# It contains a few deliberate mistakes so the Issues page has something to show.
port = 8080
Logbook dir = /var/lib/elog/logbooks
password file = /var/lib/elog/passwords.pwd
admin user = alice
self register = 0
Theme = default
preset Author = $short_name
locked attributes = Author
reverse sort = 1
Time format = %a, %d.%m.%Y %H:%M
Menu commands = New, List, Reply, Edit, Find, Copy to
List Menu commands = New, List, Find, Config, Last Day, Logout
Style Category Problem = background-color:#eb978e;
Style Subject Experiment created = background-color:#b8bbff; font-weight:bold; 030869;

Group Instruments = Laser A, STM, Cryostat
Group Experiments = STM Experiments, Transport, Raman
Group STM Experiments = stm001, stm002, stm003, stm004, stm005
Group Transport = tr001, tr002, tr003
Group Raman = r001
Group Playground = Playground

[Laser A]
comment = Femtosecond laser system
admin user = alice, dave
entries per page = 40
attributes = Author, Category, Power, Subject
Comment Power = Output power (W)
options category = Hardware{2}, Software{2}, Routine entry{1}, Problem{2}, Fix{2}, Info{2}
preset category = Routine entry
extendable attributes = Category
required attributes = Category
thread display = $Subject ($Category), entered by $author on $Entry time
quick filter = Date, Category, Subtext
page title = ELOG - $subject. $Category

[STM]
comment = STM: instrument logbook
admin user = alice, bob
entries per page = 100
attributes = Author, Category, Type, SN, Position, Responsible, Subject
options category = Hardware, Software, Routine entry, Problem, Fix, Info, Other
options Type = Tip{1}, Sample{2}
options Position = Stage, Park 1, Park 2, Prep chamber
{1}Subst SN = T-###
{2}Subst SN = S-###
Show Attributes Edit = Author, Category, Type, Responsible, Subject
{1,2} Show Attributes Edit = Author, Category, Type, SN, Position, Responsible, Subject
Comment SN = Increments automatically
Locked Attributes = Author, SN
Extendable options = Category
required attributes = Category
Fixed Attributes Reply = Type, SN
Propagate Attributes = Position, Responsible
quick filter = Type, SN, Position, Category, Subtext, Date
List display = ID, Date, Author, Category, SN, Position, Responsible, Subject
thread display = $Position $SN $Subject, entered by $author on $Entry time

#-----------------------------------------------------------------------
# Cryostat: instrument logbook
#-----------------------------------------------------------------------

[Cryostat]
Comment = Cryostat: cooldowns, maintenance, faults
Page title = Cryostat - $subject
Restrict edit = 1
Restrict edit time = 48
Attributes = Author, Category, State, T_sample [K], Subject
Options Category = Cooldown, Warmup, Measurement, Maintenance, Fault, Info
Options State = Warm, Cooling, Base, Warming up
Type T_sample [K] = numeric
Required Attributes = Author, Category, Subject
Tooltip State = State at the time of the entry
List display = ID, Date, Author, Category, State, T_sample [K], Subject
Quick filter = Date, Category, State

[STM-test]
comment = STM: test logbook
admin user = alice, bob
attributes = Author, Category, Subject
options category = Info, Other

