# Example nginx site: ELOG at https://elog.example.org/ and ELOG Manager at
# https://elog.example.org/manage/ on the same host.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/elog
#   sudo ln -s /etc/nginx/sites-available/elog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace elog.example.org and the certificate paths. Certificates from
# Let's Encrypt:  sudo certbot certonly --webroot -w /var/www/certbot -d elog.example.org
#
# Matching settings elsewhere:
#   elogd.cfg [global]:  URL = https://elog.example.org/
#                        Interface = 127.0.0.1   (elogd only reachable through nginx)
#                        Port = 8000, SSL = 0
#   ELOG Manager .env:   ELOGMGR_PORT=8090, ELOGMGR_BEHIND_PROXY=1 (default)

server {
    listen 80;
    listen [::]:80;
    server_name elog.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1; older versions: "listen 443 ssl http2;"
    server_name elog.example.org;

    ssl_certificate     /etc/letsencrypt/live/elog.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elog.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # ---- ELOG Manager ---------------------------------------------------
    # The trailing slashes matter: "/manage/" is stripped before the request
    # reaches the manager, and "/manage" is redirected to "/manage/".
    location /manage/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User     "";   # never pass a client-supplied user name
        client_max_body_size 2m;

        # add_header in a location replaces the server-level ones, so all are listed here
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # ---- ELOG -----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # match "Max content length" in elogd.cfg (bytes there, size here)
        client_max_body_size 100m;
        proxy_read_timeout 300s;   # large attachment uploads
        proxy_send_timeout 300s;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
